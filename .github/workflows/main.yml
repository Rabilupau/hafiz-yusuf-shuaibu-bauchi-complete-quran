name: Build HAFIZ Yusuf Shuaibu Bauchi Complete Qur’an APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          unzip -q "HAFIZ-Yusuf-Shuaibu-Bauchi-Complete-Quran-Cloud-Build.zip"
          cd quran_apk_project
          echo "Project extracted successfully"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: quran_apk_project
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HAFIZ-Yusuf-Shuaibu-Bauchi-Complete-Quran-APK
          path: quran_apk_project/app/build/outputs/apk/debug/app-debug.apk
